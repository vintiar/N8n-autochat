version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_restoran_lombok
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=Asia/Makassar
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n_restoran}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # Restaurant config (accessed via $env in workflows)
      - EVOLUTION_URL=${EVOLUTION_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-restoran_lombok}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - WA_OWNER_NUMBER=${WA_OWNER_NUMBER}
      - WA_KITCHEN_NUMBER=${WA_KITCHEN_NUMBER}
      - RESTAURANT_NAME=${RESTAURANT_NAME:-Restoran Sasak Lombok}
      - RESTAURANT_ADDRESS=${RESTAURANT_ADDRESS}
      - RESTAURANT_PHONE=${RESTAURANT_PHONE}
      - RESTAURANT_MAPS=${RESTAURANT_MAPS}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restoran_net

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution_api_lombok
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=${EVOLUTION_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-n8n}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-n8n_restoran}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CONFIG_SESSION_PHONE_CLIENT=Restoran Sasak Lombok
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - restoran_net

  postgres:
    image: postgres:15-alpine
    container_name: postgres_lombok
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-n8n_restoran}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restoran_net

  redis:
    image: redis:7-alpine
    container_name: redis_lombok
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - restoran_net

volumes:
  n8n_data:
  evolution_instances:
  postgres_data:
  redis_data:

networks:
  restoran_net:
    driver: bridge
